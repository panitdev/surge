[package]
name = "surge-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "surge_server"
path = "src/lib.rs"

[[bin]]
name = "surge-server"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
axum-extra.workspace = true
chrono.workspace = true
clap.workspace = true
http.workspace = true
rand.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
surge-engine = { path = "../surge-engine" }
surge = { path = "../surge", features = ["embedded", "router", "oauth-as"] }
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
base64.workspace = true
# The resource-server half, exercised end to end by `oauth_resource_server.rs`
# against a real listening authorization server.
surge = { path = "../surge", features = ["embedded", "router", "oauth-as", "resource-server"] }
jsonwebtoken.workspace = true
futures-util.workspace = true
reqwest.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }
totp-rs.workspace = true
