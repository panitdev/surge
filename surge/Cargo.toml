[package]
name = "surge"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
embedded = []
test-provider = []
router = ["dep:tower-http"]
# The native OAuth 2.1 / OIDC authorization server (internal/oauth-as.md).
# Off by default: it pulls in JWT signing, and a deployment that does not
# issue OAuth tokens should not carry the code that would.
oauth-as = ["router", "dep:jsonwebtoken", "dep:base64"]
# The resource-server half: RFC 9728 metadata, the WWW-Authenticate challenge,
# and a bearer-token extractor. Independent of `oauth-as` — a service mounts
# this without ever being an authorization server.
resource-server = ["dep:jsonwebtoken", "dep:base64"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
axum-extra.workspace = true
base64 = { workspace = true, optional = true }
chrono.workspace = true
jsonwebtoken = { workspace = true, optional = true }
http.workspace = true
moka.workspace = true
reqwest.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http = { workspace = true, optional = true }
time.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true

surge-engine = { path = "../surge-engine" }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
